name: Apply settings layout changes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-settings-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update settings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/monitor/settings-view.tsx')
          s = p.read_text()

          old = '''          <div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <Field label="Goal combined units" type="number" value={g.goalCombinedUnits} onChange={(v) => setG({ ...g, goalCombinedUnits: Number(v) })} />
            <Field label="Billing day" type="number" value={g.billingDay} onChange={(v) => setG({ ...g, billingDay: Number(v) })} />
            <TimeField label="Billing time" hour={g.billingHour} minute={g.billingMinute} onChange={(hour, minute) => setG({ ...g, billingHour: hour, billingMinute: minute })} />
            <RangeField label="Solar window (hours)" from={g.solarStartHour} to={g.solarEndHour} onFromChange={(v) => setG({ ...g, solarStartHour: v })} onToChange={(v) => setG({ ...g, solarEndHour: v })} />
          </div>
          <Button className="mt-5" onClick={() => { saveGeneral(g); setStatus("General settings saved."); }}>Save general</Button>'''
          new = '''          <div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <Field label="Goal ceiling (combined units)" type="number" value={g.goalCombinedUnits} onChange={(v) => setG({ ...g, goalCombinedUnits: Number(v) })} />
            <Field label="Billing day" type="number" value={g.billingDay} onChange={(v) => setG({ ...g, billingDay: Number(v) })} />
            <TimeField label="Billing time" hour={g.billingHour} minute={g.billingMinute} onChange={(hour, minute) => setG({ ...g, billingHour: hour, billingMinute: minute })} />
            <RangeField label="Solar window (hours)" from={g.solarStartHour} to={g.solarEndHour} onFromChange={(v) => setG({ ...g, solarStartHour: v })} onToChange={(v) => setG({ ...g, solarEndHour: v })} />
            <div className="sm:col-span-2 lg:col-span-3"><Field label="V1 app URL" value={g.v1Url} onChange={(v) => setG({ ...g, v1Url: v })} /></div>
          </div>
          <p className="mt-2 text-xs text-muted">The goal ceiling is the maximum combined units you want to finish the billing period at or below.</p>
          <Button className="mt-5" onClick={() => { saveGeneral(g); setStatus("General settings saved."); }}>Save general</Button>'''
          if old not in s:
              raise SystemExit('general block not found')
          s = s.replace(old, new, 1)

          old = '''          <p className="mt-1 text-sm text-muted">Interface theme, meter colours and the V1 shortcut.</p>'''
          new = '''          <p className="mt-1 text-sm text-muted">Interface theme and meter colours.</p>'''
          if old not in s:
              raise SystemExit('appearance description not found')
          s = s.replace(old, new, 1)

          old = '''            <div className="sm:col-span-2 lg:col-span-3"><Field label="V1 app URL" value={g.v1Url} onChange={(v) => setG({ ...g, v1Url: v })} /></div>
          </div>
          <Button className="mt-5" onClick={() => { saveGeneral(g); setStatus("Appearance and V1 link saved."); }}>Save appearance</Button>'''
          new = '''          </div>
          <Button className="mt-5" onClick={() => { saveGeneral(g); setStatus("Appearance settings saved."); }}>Save appearance</Button>'''
          if old not in s:
              raise SystemExit('appearance link block not found')
          s = s.replace(old, new, 1)

          old = '''          <h2 className="font-display text-2xl font-medium">Meter tariffs</h2>
          <p className="mt-1 text-sm text-muted">MEPCO A-1 residential slabs. Each meter remains independently configured.</p>
          <div className="mt-5 space-y-3"><TariffEditor title="Meter 1" value={a} onChange={setA} /><TariffEditor title="Meter 2" value={b} onChange={setB} /></div>
          <div className="mt-5 flex flex-wrap gap-3"><Button onClick={() => { saveTariffs(a, b); setStatus("Tariffs saved."); }}>Save tariffs</Button><Button variant="outline" onClick={restoreDemo}>Restore demo data</Button></div>'''
          new = '''          <h2 className="font-display text-2xl font-medium">Tariff schedule</h2>
          <p className="mt-1 text-sm text-muted">One MEPCO A-1 residential tariff schedule is applied to both meters. Meter usage is still tracked and billed independently.</p>
          <div className="mt-5"><TariffEditor title="Shared tariff schedule" value={a} onChange={setA} /></div>
          <div className="mt-5 flex flex-wrap gap-3"><Button onClick={() => { saveTariffs(a, a); setB(a); setStatus("Shared tariff schedule saved for both meters."); }}>Save tariff schedule</Button><Button variant="outline" onClick={restoreDemo}>Restore demo data</Button></div>'''
          if old not in s:
              raise SystemExit('tariff block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/monitor/settings-view.tsx .github/workflows/apply-settings-layout.yml
          git commit -m 'Reorganize settings and use shared tariff schedule' || exit 0
          git rm .github/workflows/apply-settings-layout.yml
          git commit -m 'Remove temporary settings migration workflow'
          git push origin main
