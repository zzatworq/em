name: Remove responsive table duplication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-settings-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove mobile table duplicates
        run: |
          python - <<'PY'
          from pathlib import Path

          def remove_block(text, marker):
              start = text.find(marker)
              if start < 0:
                  return text
              tag_start = start
              tag_end = text.find('>', tag_start)
              if tag_end < 0:
                  raise SystemExit(f'Opening tag not complete: {marker}')
              depth = 0
              i = tag_start
              while i < len(text):
                  open_i = text.find('<div', i)
                  close_i = text.find('</div>', i)
                  if close_i < 0:
                      raise SystemExit(f'Could not find closing div for {marker}')
                  if open_i >= 0 and open_i < close_i:
                      end = text.find('>', open_i)
                      if end < 0:
                          raise SystemExit('Malformed div')
                      depth += 1
                      i = end + 1
                  else:
                      depth -= 1
                      i = close_i + len('</div>')
                      if depth == 0:
                          return text[:start] + text[i:]
              raise SystemExit(f'Could not match block: {marker}')

          for name in ('history-view.tsx', 'readings-view.tsx'):
              p = Path('src/components/monitor') / name
              s = p.read_text()
              s = remove_block(s, '<div className="grid gap-2 sm:hidden">')
              s = s.replace('className="hidden overflow-x-auto sm:block"', 'className="overflow-x-auto"')
              p.write_text(s)
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/monitor/history-view.tsx src/components/monitor/readings-view.tsx
          git commit -m 'Remove responsive table duplication'
          git rm -f .github/workflows/fix-settings-layout.yml .github/workflows/apply-settings-layout.yml
          git commit -m 'Remove temporary migration workflows'
          git push origin main
