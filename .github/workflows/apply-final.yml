name: Apply final requested changes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            async function replace(file, oldText, newText) {
              const r = await github.rest.repos.getContent({owner, repo, path:file, ref:'main'});
              const text = Buffer.from(r.data.content, 'base64').toString('utf8');
              if (!text.includes(oldText)) throw new Error(`Expected text not found in ${file}`);
              const updated = text.replace(oldText, newText);
              await github.rest.repos.createOrUpdateFileContents({owner, repo, path:file, message:'Apply final requested monitor fixes', content:Buffer.from(updated).toString('base64'), sha:r.data.sha, branch:'main'});
            }
            await replace('src/components/monitor/settings-view.tsx',
              '<Field label="Billing hour" type="number" value={g.billingHour} onChange={(v) => setG({ ...g, billingHour: Number(v) })} />\n            <Field label="Billing minute" type="number" value={g.billingMinute} onChange={(v) => setG({ ...g, billingMinute: Number(v) })} />\n            <Field label="Solar start hour" type="number" value={g.solarStartHour} onChange={(v) => setG({ ...g, solarStartHour: Number(v) })} />\n            <Field label="Solar end hour" type="number" value={g.solarEndHour} onChange={(v) => setG({ ...g, solarEndHour: Number(v) })} />',
              '<TimeField label="Billing time" hour={g.billingHour} minute={g.billingMinute} onChange={(hour, minute) => setG({ ...g, billingHour: hour, billingMinute: minute })} />\n            <RangeField label="Solar window (hours)" from={g.solarStartHour} to={g.solarEndHour} onFromChange={(v) => setG({ ...g, solarStartHour: v })} onToChange={(v) => setG({ ...g, solarEndHour: v })} />');
            await replace('src/lib/engine/dashboard.ts',
              '  // Keep both projection models available: the optional 50/50 model and the\n  // actual per-meter projection. The Bill page chooses between them.\n  const projectedHalf = projectedConsumptionCombined / 2;\n  const split1 = calculateMeterBill(projectedHalf, tariff1);\n  const split2 = calculateMeterBill(projectedHalf, tariff2);',
              '  // "Assume 50/50" should only guess at the *remaining* (not-yet-consumed)\n  // portion of the month, since that\'s the only part we don\'t know the\n  // real per-meter split for. Units already consumed are already known\n  // per meter from actual readings and must stay attributed to their real\n  // meter — splitting the whole projected total in half discarded that\n  // known data and just guessed at the entire month.\n  const actualNewSoFar = billingNew === "" ? 0 : Number(billingNew);\n  const actualOldSoFar = billingOld === "" ? 0 : Number(billingOld);\n  const remainingTotal = isCurrent ? Math.max(0, projection.total - (actualNewSoFar + actualOldSoFar)) : 0;\n  const halfRemaining = remainingTotal / 2;\n  const split1 = calculateMeterBill(actualNewSoFar + halfRemaining, tariff1);\n  const split2 = calculateMeterBill(actualOldSoFar + halfRemaining, tariff2);');
            await replace('src/lib/engine/time.ts',
              'export function addMonth(date: Date): Date {\n  return new Date(\n    date.getFullYear(), date.getMonth() + 1, date.getDate(),\n    date.getHours(), date.getMinutes(), date.getSeconds(), date.getMilliseconds(),\n  );\n}',
              'export function addMonth(date: Date): Date {\n  // new Date(y, m+1, day, ...) silently overflows into the month after next\n  // when the target month is shorter than `day` (e.g. day=30 in a\n  // 28/29-day February rolls into March). Clamp to the target month\'s\n  // actual last day instead, so a billing day near month-end doesn\'t\n  // silently stretch the period by a few extra days.\n  const targetMonth = date.getMonth() + 1;\n  const daysInTargetMonth = new Date(date.getFullYear(), targetMonth + 1, 0).getDate();\n  const day = Math.min(date.getDate(), daysInTargetMonth);\n  return new Date(\n    date.getFullYear(), targetMonth, day,\n    date.getHours(), date.getMinutes(), date.getSeconds(), date.getMilliseconds(),\n  );\n}');
            const wf = await github.rest.repos.getContent({owner, repo, path:'.github/workflows/apply-final.yml', ref:'main'});
            await github.rest.repos.deleteFile({owner, repo, path:'.github/workflows/apply-final.yml', message:'Remove temporary diff workflow', sha:wf.data.sha, branch:'main'});
