name: Apply requested diff

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}")
              p.write_text(s.replace(old, new, 1))

          replace(
              'src/components/monitor/bill-view.tsx',
              'Both meters billed as half of projected consumption.',
              'Units already used stay with their actual meter; only the remaining projected units for the rest of the month are split evenly.'
          )

          p = Path('src/components/monitor/history-view.tsx')
          s = p.read_text()
          old = '''      <div className="overflow-x-auto">\n        <table className="w-full min-w-[28rem] text-sm">'''
          new = '''      <div className="grid gap-2 sm:hidden">\n        {sorted.map((r) => (\n          <div key={r.id} className="rounded-xl border border-border p-3">\n            <div className="flex items-center justify-between">\n              <span className="text-sm font-medium">{r.month}</span>\n              <span className="text-xs font-medium text-muted">{r.status}</span>\n            </div>\n            <dl className="mt-2 grid grid-cols-3 gap-2 text-sm">\n              <div><dt className="text-xs text-muted">Units</dt><dd className="tabular-nums">{units(r.units, 0)}</dd></div>\n              <div><dt className="text-xs text-muted">Bill</dt><dd className="tabular-nums">{money(r.bill)}</dd></div>\n              <div><dt className="text-xs text-muted">Paid</dt><dd className="tabular-nums">{money(r.payment)}</dd></div>\n            </dl>\n          </div>\n        ))}\n      </div>\n      <div className="hidden overflow-x-auto sm:block">\n        <table className="w-full min-w-[28rem] text-sm">'''
          if old not in s: raise SystemExit('Expected history table markup not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/monitor/readings-view.tsx')
          s = p.read_text()
          old = '<div className="mt-5 overflow-x-auto"><table className="w-full min-w-[40rem] text-sm">'
          new = '''<div className="mt-5 grid gap-2 sm:hidden">{sorted.slice(0, 80).map((r) => <div key={r.id} className="rounded-xl border border-border p-3"><div className="flex items-center justify-between gap-2"><span className="text-sm font-medium">{new Date(r.datetime).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "numeric", minute: "2-digit" })}</span><Button variant="ghost" size="sm" onClick={() => deleteReading(r.id)}>Remove</Button></div><dl className="mt-2 grid grid-cols-3 gap-2 text-sm"><div><dt className="text-xs text-muted">Meter 1</dt><dd className="tabular-nums">{units(r.newInput)}</dd></div><div><dt className="text-xs text-muted">Meter 2</dt><dd className="tabular-nums">{units(r.oldInput)}</dd></div><div><dt className="text-xs text-muted">Load</dt><dd className="tabular-nums">{units(r.loadKw)}</dd></div></dl></div>)}</div><div className="mt-5 hidden overflow-x-auto sm:block"><table className="w-full min-w-[40rem] text-sm">'''
          if old not in s: raise SystemExit('Expected readings table markup not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/monitor/settings-view.tsx')
          s = p.read_text()
          old = 'function TariffEditor({ title, value, onChange }: { title: string; value: Tariff; onChange: (t: Tariff) => void }) {'
          new = '''function TimeField({ label, hour, minute, onChange }: { label: string; hour: number; minute: number; onChange: (hour: number, minute: number) => void }) {\n  const pad = (n: number) => String(n).padStart(2, "0");\n  return <div><Label>{label}</Label><Input className="mt-1" type="time" value={`${pad(hour)}:${pad(minute)}`} onChange={(e) => { const [h, m] = e.target.value.split(":").map(Number); if (!Number.isNaN(h) && !Number.isNaN(m)) onChange(h, m); }} /></div>;\n}\nfunction RangeField({ label, from, to, onFromChange, onToChange }: { label: string; from: number; to: number; onFromChange: (v: number) => void; onToChange: (v: number) => void }) {\n  return <div><Label>{label}</Label><div className="mt-1 flex items-center gap-2"><Input type="number" min={0} max={23} value={from} onChange={(e) => onFromChange(Number(e.target.value))} aria-label={`${label} start`} /><span className="text-sm text-muted">–</span><Input type="number" min={0} max={23} value={to} onChange={(e) => onToChange(Number(e.target.value))} aria-label={`${label} end`} /></div></div>;\n}\nfunction TariffEditor({ title, value, onChange }: { title: string; value: Tariff; onChange: (t: Tariff) => void }) {'''
          if old not in s: raise SystemExit('Expected settings tariff function not found')
          p.write_text(s.replace(old, new, 1))
          old = '<Field label="Billing hour" type="number" value={g.billingHour} onChange={(v) => setG({ ...g, billingHour: Number(v) })} /><Field label="Billing minute" type="number" value={g.billingMinute} onChange={(v) => setG({ ...g, billingMinute: Number(v) })} /><Field label="Solar start hour" type="number" value={g.solarStartHour} onChange={(v) => setG({ ...g, solarStartHour: Number(v) })} /><Field label="Solar end hour" type="number" value={g.solarEndHour} onChange={(v) => setG({ ...g, solarEndHour: Number(v) })} />'
          new = '<TimeField label="Billing time" hour={g.billingHour} minute={g.billingMinute} onChange={(hour, minute) => setG({ ...g, billingHour: hour, billingMinute: minute })} /><RangeField label="Solar window (hours)" from={g.solarStartHour} to={g.solarEndHour} onFromChange={(v) => setG({ ...g, solarStartHour: v })} onToChange={(v) => setG({ ...g, solarEndHour: v })} />'
          if old not in s: raise SystemExit('Expected settings general fields not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/lib/engine/dashboard.ts')
          s = p.read_text()
          old = '''  const assumedUnits = isCurrent ? projection.total : Number(billingTotal || 0);\n  const half = assumedUnits / 2;\n  const split1 = calculateMeterBill(half, tariff1);\n  const split2 = calculateMeterBill(half, tariff2);'''
          new = '''  // "Assume 50/50" should only guess at the *remaining* (not-yet-consumed)\n  // portion of the month, since that's the only part we don't know the\n  // real per-meter split for. Units already consumed are already known\n  // per meter from actual readings and must stay attributed to their real\n  // meter — splitting the whole projected total in half discarded that\n  // known data and just guessed at the entire month.\n  const actualNewSoFar = billingNew === "" ? 0 : Number(billingNew);\n  const actualOldSoFar = billingOld === "" ? 0 : Number(billingOld);\n  const remainingTotal = isCurrent ? Math.max(0, projection.total - (actualNewSoFar + actualOldSoFar)) : 0;\n  const halfRemaining = remainingTotal / 2;\n  const split1 = calculateMeterBill(actualNewSoFar + halfRemaining, tariff1);\n  const split2 = calculateMeterBill(actualOldSoFar + halfRemaining, tariff2);'''
          if old not in s: raise SystemExit('Expected dashboard split block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/lib/engine/time.ts')
          s = p.read_text()
          old = '''export function addMonth(date: Date): Date {\n  return new Date(\n    date.getFullYear(), date.getMonth() + 1, date.getDate(),\n    date.getHours(), date.getMinutes(), date.getSeconds(), date.getMilliseconds(),\n  );\n}'''
          new = '''export function addMonth(date: Date): Date {\n  // new Date(y, m+1, day, ...) silently overflows into the month after next\n  // when the target month is shorter than `day` (e.g. day=30 in a\n  // 28/29-day February rolls into March). Clamp to the target month's\n  // actual last day instead, so a billing day near month-end doesn't\n  // silently stretch the period by a few extra days.\n  const targetMonth = date.getMonth() + 1;\n  const daysInTargetMonth = new Date(date.getFullYear(), targetMonth + 1, 0).getDate();\n  const day = Math.min(date.getDate(), daysInTargetMonth);\n  return new Date(\n    date.getFullYear(), targetMonth, day,\n    date.getHours(), date.getMinutes(), date.getSeconds(), date.getMilliseconds(),\n  );\n}'''
          if old not in s: raise SystemExit('Expected addMonth implementation not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/monitor/bill-view.tsx src/components/monitor/history-view.tsx src/components/monitor/readings-view.tsx src/components/monitor/settings-view.tsx src/lib/engine/dashboard.ts src/lib/engine/time.ts
          git rm .github/workflows/apply-requested-diff.yml
          git commit -m 'Apply requested monitor UI and billing fixes'
          git push
