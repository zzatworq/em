name: Apply requested monitor changes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const files = [
              ['src/components/monitor/bill-view.tsx', 'Both meters billed as half of projected consumption.', 'Units already used stay with their actual meter; only the remaining projected units for the rest of the month are split evenly.'],
            ];
            for (const [file, oldText, newText] of files) {
              const r = await github.rest.repos.getContent({owner, repo, path:file, ref:'main'});
              const text = Buffer.from(r.data.content, 'base64').toString('utf8');
              if (!text.includes(oldText)) throw new Error(`Expected text not found in ${file}`);
              const updated = text.replace(oldText, newText);
              await github.rest.repos.createOrUpdateFileContents({owner, repo, path:file, message:'Apply requested monitor UI and billing fixes', content:Buffer.from(updated).toString('base64'), sha:r.data.sha, branch:'main'});
            }
            await github.rest.repos.deleteFile({owner, repo, path:'.github/workflows/apply-requested-diff.yml', message:'Remove temporary diff workflow', sha:context.payload.head_commit?.id ? (await github.rest.repos.getContent({owner, repo, path:'.github/workflows/apply-requested-diff.yml', ref:'main'})).data.sha : undefined, branch:'main'}).catch(()=>{});
